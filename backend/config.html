<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置联网 AI · 同学堂助手</title><link rel="stylesheet" href="config.css"></head><body><main><span class="eyebrow">同学堂助手 / 联网 AI</span><h1>连接云端模型</h1><p>本机服务负责中转题目，实际作答由 OpenAI 云端模型完成。学校账号密码始终由你在同学堂浏览器中管理。</p><form id="form"><label>OpenAI API Key<input id="apiKey" type="password" autocomplete="off" required placeholder="只在本机服务内存中使用"></label><label>模型名称<input id="model" value="gpt-6-luna" required></label><button>保存到当前服务进程</button></form><p class="muted">Key 不写入插件，不保存到磁盘。关闭服务后需重新填写；也可以使用 OPENAI_API_KEY 环境变量。</p><section><h2>连接插件</h2><p>将下面的连接口令复制到插件“设置”，再点“检查连接”。这不是学校密码，也不是 API Key。</p><input id="token" readonly aria-label="连接口令"><button id="copy" class="secondary">复制连接口令</button></section><p id="status" role="status"></p><p class="muted">本版本使用标准 OpenAI API，按 API 用量计费；未集成 ChatGPT 订阅授权。模型名称可改成你 API 账户支持的模型。</p></main><script src="config.js"></script></body></html>
